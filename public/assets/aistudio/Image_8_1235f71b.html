<script>
  // Simple micro-interactions for immersive delight
  (function() {
    const playBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    let isPlaying = true;

    if (playBtn && playIcon) {
      playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      });
    }

    const likeBtn = document.getElementById('likeBtn');
    let liked = true;
    if (likeBtn) {
      likeBtn.addEventListener('click', () => {
        liked = !liked;
        const icon = likeBtn.querySelector('.material-symbols-outlined');
        if (liked) {
          likeBtn.classList.remove('text-on-surface-variant');
          likeBtn.classList.add('text-primary-container');
          icon.style.fontVariationSettings = "'FILL' 1";
        } else {
          likeBtn.classList.remove('text-primary-container');
          likeBtn.classList.add('text-on-surface-variant');
          icon.style.fontVariationSettings = "'FILL' 0";
        }
      });
    }
  })();
</script></main></body></html>
